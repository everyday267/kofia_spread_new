name: KOFIA Corp Bond Spread

on:
  schedule:
    - cron: "23 19 * * 0-4"   # primary: KST 06:23
  workflow_dispatch:
    inputs:
      backfill_months:
        description: "과거 이력 일괄 적재 개월 수 (0 = 평상시 실행, 최초 1회 60 권장)"
        required: false
        default: "0"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check-businessday:
    runs-on: ubuntu-latest
    outputs:
      is_open: ${{ steps.check.outputs.is_open }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install exchange_calendars pandas
      - id: check
        run: |
          python - <<'EOF'
          import os, pandas as pd, exchange_calendars as xcals
          from datetime import datetime, timezone, timedelta
          kst = timezone(timedelta(hours=9))
          today = pd.Timestamp(datetime.now(kst).date())
          xkrx = xcals.get_calendar("XKRX")
          is_open = xkrx.is_session(today)
          print(f"KST today: {today.date()}, is_open: {is_open}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"is_open={'true' if is_open else 'false'}\n")
          EOF

  run:
    needs: check-businessday
    permissions:
      contents: write          # data/ · docs/ 커밋용
    if: needs.check-businessday.outputs.is_open == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run KOFIA collector & send mail
        env:
          MONTHS: "3"
          BOND_GB: "7"
          REMAIN_DAY_CNT: "3"                # 메일용 잔존만기 (3 = 국고 3개월물)
          HISTORY_TENORS: "3,12,36"          # 대시보드 잔존만기 (3개월·1년·3년)
          BACKFILL_MONTHS: ${{ github.event.inputs.backfill_months || '0' }}
          SENDER_EMAIL: ${{ secrets.GMAIL_SENDER }}
          SENDER_PW:    ${{ secrets.GMAIL_APP_PW }}
          RECIPIENTS:   ${{ secrets.MAIL_RECIPIENTS }}
        run: python kofia_spread.py

      - name: Commit history & dashboard
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs 2>/dev/null || true
          git diff --cached --quiet && { echo "이력/대시보드 변경 없음"; exit 0; }
          git commit -q -m "data: spread history & dashboard $(TZ=Asia/Seoul date +%Y%m%d)"
          git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload xlsx artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kofia-spread
          path: output/*.xlsx
          retention-days: 30
