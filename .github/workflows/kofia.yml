name: KOFIA Corp Bond Spread

on:
  schedule:
    - cron: "0 9 * * 1-5"   # KST 18:00 (UTC 09:00), 평일
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run KOFIA collector & send mail
        env:
          MONTHS: "3"
          BOND_GB: "7"
          SENDER_EMAIL: ${{ secrets.GMAIL_SENDER }}
          SENDER_PW:    ${{ secrets.GMAIL_APP_PW }}
          RECIPIENTS:   ${{ secrets.MAIL_RECIPIENTS }}
        run: python kofia_spread.py

      - name: Upload xlsx artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kofia-spread
          path: output/*.xlsx
          retention-days: 30
